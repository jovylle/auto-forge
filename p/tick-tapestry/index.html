<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tick Tapestry</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main id="app">
    <header class="mast">
      <div class="mast__left">
        <h1>Tick Tapestry</h1>
        <p class="sub">each second a thread — time woven into cloth</p>
      </div>
      <div class="mast__right">
        <span id="counter" class="counter">0 threads</span>
        <span id="status" class="status">weaving</span>
      </div>
    </header>

    <section class="stage-wrap">
      <canvas id="tapestry" width="640" height="360"></canvas>
    </section>

    <section class="controls">
      <div class="row">
        <label>speed
          <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1" />
          <span id="speedVal">1.0×</span>
        </label>
        <label>palette
          <select id="palette">
            <option value="rust">rust &amp; bone</option>
            <option value="moss">moss &amp; ash</option>
            <option value="ochre">ochre &amp; ink</option>
            <option value="blood">blood &amp; dust</option>
          </select>
        </label>
      </div>
      <div class="row buttons">
        <button id="pause">pause</button>
        <button id="rewind">rewind</button>
        <button id="reset">reset</button>
        <button id="export" class="primary">export gif</button>
      </div>
      <div class="progress" id="progress" hidden>
        <div class="progress__bar" id="progressBar"></div>
        <span id="progressText">encoding…</span>
      </div>
    </section>

    <footer class="foot">
      <small>no fonts loaded. grunge. localStorage keeps your weave.</small>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
