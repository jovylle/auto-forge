<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hourglass Drift Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="app">
    <header class="glass topbar">
      <div>
        <h1>Hourglass Drift Canvas</h1>
        <p class="sub">Watch sand flow and rebuild shapes as time runs out.</p>
      </div>
      <div class="timer glass" id="timer" aria-label="time remaining">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle class="track" cx="32" cy="32" r="28" />
          <circle class="ring" id="ring" cx="32" cy="32" r="28" />
        </svg>
        <span id="time">10</span>
      </div>
    </header>
    <section class="stage glass">
      <canvas id="c"></canvas>
      <div class="shape-label" id="shapeLabel">circle</div>
    </section>
    <footer class="glass controls">
      <div class="themes" id="themes"></div>
      <div class="btns">
        <button id="pause" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <div class="status" id="status">Flowing…</div>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
