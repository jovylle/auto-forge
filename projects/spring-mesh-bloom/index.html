<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spring Mesh Bloom</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="shell">
    <header class="bar">
      <div class="brand">
        <span class="dot"></span>
        <h1>Spring Mesh Bloom</h1>
      </div>
      <p class="sub">springy mesh · settles into bloom · cyberpunk physics</p>
    </header>

    <section class="controls">
      <label class="ctrl">
        <span>gravity</span>
        <input id="gravity" type="range" min="0" max="3" step="0.05" value="1.2" />
        <em id="gval">1.20</em>
      </label>
      <button id="damp" class="btn toggle" aria-pressed="true">damping: on</button>
      <button id="reset" class="btn">reset</button>
      <button id="export" class="btn primary">export PNG</button>
    </section>

    <main class="stage">
      <canvas id="c"></canvas>
      <div class="hint">drag a node · watch it bloom</div>
    </main>

    <footer class="foot">
      <span>verlet spring-mass · canvas 2d · no external fonts</span>
    </footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
