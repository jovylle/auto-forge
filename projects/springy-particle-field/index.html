<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Springy Particle Field — Bauhaus Physics Toy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="frame">
    <header class="mast">
      <div class="mast__left">
        <span class="kicker">Springy Particle Field</span>
        <h1>Gravity &amp; Springs</h1>
      </div>
      <div class="mast__right">
        <div class="legend">
          <span class="dot dot--red"></span><span class="dot dot--blue"></span><span class="dot dot--yellow"></span>
        </div>
      </div>
    </header>

    <section class="stage-wrap">
      <canvas id="stage" aria-label="Interactive spring particle field"></canvas>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div class="hint-overlay">drag on the canvas to pull · space resets</div>
    </section>

    <section class="controls">
      <div class="ctrl ctrl--slider">
        <label for="stiff">Spring stiffness <b id="stiffVal">0.12</b></label>
        <input id="stiff" type="range" min="0.02" max="0.45" step="0.01" value="0.12" />
      </div>
      <div class="ctrl ctrl--btns">
        <button id="grav" class="btn btn--blue" type="button">Gravity: Down</button>
        <button id="reset" class="btn btn--red" type="button">Reset Calm</button>
      </div>
      <div class="ctrl ctrl--meta">
        <span class="stat"><em id="particles">0</em> particles</span>
        <span class="stat"><em id="fps">—</em> fps</span>
      </div>
    </section>

    <footer class="foot">
      <p>Bauhaus study · primary colors, geometric grid, no ornament. <kbd>g</kbd> flips gravity · <kbd>r</kbd> resets · type <code>bauhaus</code> for a surprise.</p>
    </footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
