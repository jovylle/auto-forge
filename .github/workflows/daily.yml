name: daily (backup — hermes cron is primary)
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: build gallery (publish-only — hermes cron owns ticks, see logs/triage-2026-10-15-pages.log)
        run: npm run build:gallery
      - name: deploy pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
